<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>قارئ القصة</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            background-color: #faf9f6;
            color: #2c3e50;
            overflow: hidden;
        }

        .app-frame {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* العنوان العلوي المصغر والثابت */
        .story-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 10px 15px;
            border-bottom: 1px solid #f0f0f0;
            text-align: center;
            z-index: 10;
        }

        .story-header h1 {
            font-size: 1.05rem;
            color: #1a202c;
            font-weight: 700;
        }

        /* حاوية النص (تأخذ المساحة كاملة وتتيح التمرير العمودي) */
        .story-container {
            flex: 1;
            margin-top: 45px;
            margin-bottom: 10px;
            padding: 20px 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            max-width: 750px;
            margin-left: auto;
            margin-right: auto;
            width: 100%;
            -webkit-overflow-scrolling: touch; /* تمرير سلس جداً على الهواتف */
        }

        .page-content {
            font-size: 1.12rem;
            line-height: 2.4;
            color: #334155;
            text-align: justify;
        }
    </style>
</head>
<body>

    <div class="app-frame" id="appFrame">
        <!-- العنوان الثابت في الأعلى -->
        <header class="story-header">
            <h1 id="main-title">جاري تحميل القصة...</h1>
        </header>

        <!-- حاوية النص القابلة للتمرير -->
        <main class="story-container" id="container">
            <div id="page-content" class="page-content"></div>
        </main>
    </div>

    <!-- كود التحميل الديناميكي للقصة -->
    <script>
        // استخراج معرف القصة من الرابط (مثال: story.html?id=000001)
        const urlParams = new URLSearchParams(window.location.search);
        const storyId = urlParams.get('id') || '000001';

        // تحميل ملف الجافاسكريبت الخاص بالقصة تلقائياً
        const script = document.createElement('script');
        script.src = `stories/story-${storyId}.js`;
        
        script.onload = function() {
            if (typeof storyData !== 'undefined') {
                document.getElementById('main-title').innerText = storyData.title;
                
                const contentDiv = document.getElementById('page-content');
                
                // دمج جميع صفحات القصة في نص متواصل واحد مع مسافات فاصلة
                let fullStoryText = "";
                if (Array.isArray(storyData.pages)) {
                    fullStoryText = storyData.pages.join('\n\n\n');
                } else if (storyData.content) {
                    fullStoryText = storyData.content;
                }

                // عرض النص وتحويل الأسطر إلى فواصل HTML
                contentDiv.innerHTML = fullStoryText.replace(/\n/g, '<br>');
            } else {
                showError("ملف القصة فارغ أو تالف.");
            }
        };

        script.onerror = function() {
            showError(`عذراً، لم يتم العثور على القصة رقم (${storyId})`);
        };

        document.head.appendChild(script);

        function showError(msg) {
            document.getElementById('main-title').innerText = "تنبيه";
            document.getElementById('page-content').innerText = msg;
        }
    </script>
</body>
</html>
