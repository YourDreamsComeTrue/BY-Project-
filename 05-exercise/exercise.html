<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="exercise-style.css">
</head>
<body>

  <div class="exercise-card">
    <div class="question-title" id="questionText">جاري تحميل السؤال...</div>

    <div class="color-picker-toolbar">
      <button class="color-btn green" id="btnGreen" title="أخضر فاتح"></button>
      <button class="color-btn red" id="btnRed" title="أحمر فاتح"></button>
      <button class="color-btn reset" id="btnReset" title="إعادة افتراضي"></button>
    </div>

    <textarea 
      id="userAnswer" 
      placeholder="اكتب إجابتك هنا..."
      dir="rtl"
    ></textarea>

    <!-- شريط الأزرار الرئيسي المصغر -->
    <div id="attempt-controls">
      <button type="button" class="btn-attempt-control btn-new" id="btnNewAttempt" title="محاولة جديدة">+</button>
      <button type="button" class="btn-attempt-control" id="btnOpenHistory" title="سجل المحاولات">☰</button>
      <button type="button" class="btn-attempt-control btn-fav" id="btn-fav-exercise" title="إضافة للمفضلة">⭐</button>
    </div>
  </div>

  <!-- النافذة المنبثقة لسجل المحاولات -->
  <div id="historyModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3>سجل المحاولات السابقـة</h3>
        <button type="button" class="close-modal-btn" id="btnCloseModal">&times;</button>
      </div>
      <div class="modal-body" id="modalHistoryList">
        <!-- يتم رسم قائمة المحاولات هنا ديناميكياً -->
      </div>
    </div>
  </div>

  <script type="module" src="exercise-engine.js"></script>
</body>
</html>
