<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="exercise-style.css">
</head>
<body>

  <div class="exercise-card">
    <div class="question-title" id="questionText">جاري تحميل السؤال...</div>

    <div class="color-picker-toolbar">
      <button class="color-btn green" id="btnGreen" title="أخضر فاتح"></button>
      <button class="color-btn red" id="btnRed" title="أحمر فاتح"></button>
      <button class="color-btn reset" id="btnReset" title="إعادة افتراضي"></button>
    </div>

    <textarea 
      id="userAnswer" 
      placeholder="اكتب إجابتك هنا..."
      dir="rtl"
    ></textarea>
  </div>

  <script type="module" src="exercise-engine.js"></script>
</body>
</html>
