<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>العنوان</title>
    <link rel="stylesheet" href="title-style.css">
    <style>
      /* محاذاة العنوان الرئيسي إلى اليمين */
      .title-header {
          text-align: right;
      }
      .main-title {
          text-align: right;
      }

      /* تنسيقات حاوية المحتوى مع زر الإغلاق والتمدد التلقائي */
      .tab-content-area {
          position: relative;
          display: none;
          margin: 20px 0;
          padding: 25px 20px 45px 20px;
          background: #fff;
          border-radius: 12px;
          box-shadow: 0 4px 10px rgba(0,0,0,0.05);
          max-height: 80vh;
          overflow-y: auto;
      }

      /* زر الإغلاق الأحمر (X) */
      .close-btn {
          position: absolute;
          bottom: 10px;
          left: 15px;
          background-color: #ff4d4d;
          color: white;
          border: none;
          border-radius: 50%;
          width: 26px;
          height: 26px;
          font-size: 14px;
          font-weight: bold;
          cursor: pointer;
          display: flex;
          align-items: center;
          justify-content: center;
          line-height: 1;
          box-shadow: 0 2px 5px rgba(0,0,0,0.2);
          transition: background-color 0.2s;
      }
      .close-btn:hover {
          background-color: #cc0000;
      }

      /* توسيع مساحة التمرين وإلغاء الهوامش الضيقة */
      .exercises-wrapper {
          width: 100%;
          margin: 0;
          padding: 0;
          display: block;
      }

      /* إصلاح تداخل التمارين: ترتيب رأسي + مسافات أمان وإلغاء قيود الارتفاع */
      #exercises-container, .exercises-list {
          width: 100% !important;
          display: flex !important;
          flex-direction: column !important;
          gap: 20px !important; /* مسافة أمان ثابتة تمنع التداخل بين البطاقات */
          height: auto !important;
          min-height: min-content !important;
          overflow: visible !important;
      }

      /* اجبار كل iframe على التمدد بشكل مستقل */
      #exercises-container iframe {
          width: 100% !important;
          display: block !important;
          flex-shrink: 0 !important;
          border: none !important;
      }
    </style>
</head>
<body>

    <main class="title-container">
        <!-- 1. كتابة العنوان -->
        <header class="title-header">
            <h1 id="title-heading" class="main-title">جاري التحميل...</h1>
        </header>

        <!-- 2. الأيقونات الأربعة -->
        <nav class="nav-icons">
            <button class="icon-btn" data-tab="watch" id="btn-watch">
                <span class="label">المشاهدة</span>
            </button>
            <button class="icon-btn" data-tab="explain" id="btn-explain">
                <span class="label">الشرح</span>
            </button>
            <button class="icon-btn" data-tab="summary" id="btn-summary">
                <span class="label">الملخص</span>
            </button>
            <button class="icon-btn" data-tab="rituels" id="btn-rituels">
                <span class="label">الطقوس</span>
            </button>
        </nav>

        <!-- مساحة عرض المحتوى الديناميكية -->
        <section id="tab-content-area" class="tab-content-area">
            <div id="tab-body"></div>
            <button id="close-tab-btn" class="close-btn" title="إغلاق">✕</button>
        </section>

        <hr class="section-divider">

        <!-- 3. مساحة استدعاء التمارين -->
        <section class="exercises-wrapper">
            <div id="exercises-container" class="exercises-list"></div>
        </section>
    </main>

    <script type="module" src="title-engine.js"></script>
</body>
                </html>
