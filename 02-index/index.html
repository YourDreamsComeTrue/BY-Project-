<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فهرس الدروس</title>
    <link rel="stylesheet" href="index-style.css">
</head>
<body>

    <main class="index-container">
        <header class="index-header">
            <div class="header-top">
                <div>
                    <h1>فهرس الدروس</h1>
                    <p>اختر التصنيفات المناسبة لتصفية الدروس</p>
                </div>
                <!-- الأيقونات الثلاث العلوية (الفهرس، الترتيب، المفضلة) -->
                <div class="top-actions-bar">
                    <a href="index.html" class="top-action-btn">📁 الفهرس</a>
                    <button type="button" class="top-action-btn" id="btnOpenSortModal">🔄 الترتيب</button>
                    <a href="../07-favorites/favorite.html" class="top-action-btn favorites">⭐ المفضلة</a>
                </div>
            </div>
        </header>

        <!-- منطقة الفلاتر المركبة -->
        <section class="filter-section">
            <!-- فلتر الترتيب القديم تم نقله للنافذة المنبثقة، ولكن نترك الـ select مخفياً أو بمعرفه لكي لا يتوقف ملف الـ JavaScript عن العمل -->
            <div class="filter-group filter-group-sort" style="display: none;">
                <label>الترتيب:</label>
                <select id="sort-select" class="filter-select">
                    <option value="asc">من الأقدم للأحدث</option>
                    <option value="desc">من الأحدث للأقدم</option>
                </select>
            </div>

            <!-- فلتر النوع -->
            <div class="filter-group">
                <label>نوع المحتوى:</label>
                <div id="type-filters" class="chips-group">
                    <button class="chip active" data-type="all">الكل</button>
                    <button class="chip" data-type="video">فيديو</button>
                    <button class="chip" data-type="short">شورت</button>
                    <button class="chip" data-type="lecture">محاضرة</button>
                </div>
            </div>

            <!-- فلتر الموضوعات (يتولد ديناميكياً) -->
            <div class="filter-group">
                <label>الموضوع:</label>
                <div id="topic-filters" class="chips-group">
                    <!-- سيتم توليد الأزرار تلقائياً عبر السكريبت -->
                </div>
            </div>
        </section>

        <!-- شبكة عرض البطاقات -->
        <section id="lessons-grid" class="lessons-grid">
            <!-- سيتم صب بطاقات الدروس هنا -->
        </section>
    </main>

    <!-- النافذة المنبثقة الخاصة بالترتيب -->
    <div id="sortModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>خيارات الترتيب</h3>
                <button type="button" class="close-modal-btn" id="btnCloseSortModal">&times;</button>
            </div>
            <div class="sort-options-list">
                <p style="margin: 0 0 10px 0; font-size: 0.9rem; color: #94a3b8;">اختر طريقة ترتيب العرض:</p>
                <button type="button" class="top-action-btn sort-option-btn" data-sort-val="asc" style="width: 100%; justify-content: center; margin-bottom: 8px;">من الأقدم للأحدث</button>
                <button type="button" class="top-action-btn sort-option-btn" data-sort-val="desc" style="width: 100%; justify-content: center;">من الأحدث للأقدم</button>
            </div>
        </div>
    </div>

    <script type="module" src="index-engine.js"></script>
</body>
</html>
