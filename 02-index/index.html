<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فهرس الدروس</title>
    <link rel="stylesheet" href="index-style.css">
</head>
<body>

    <!-- عنصر فيديو خلفي ديناميكي (يظهر إذا تم اختيار خلفية فيديو) -->
    <video id="bg-video-element" autoplay muted loop style="display: none;"></video>

    <main class="index-container" id="mainContainer">
        <!-- الهيدر العلوي: أزرار الفهرس والترتيب والمفضلة يميناً، وأيقونات الموسيقى والخلفيات يساراً -->
        <header class="index-header">
            <div class="header-top">
                <div class="top-actions-bar">
                    <a href="index.html" class="top-action-btn">📁 الفهرس</a>
                    <button type="button" class="top-action-btn" id="btnOpenSortModal">🔄 الترتيب</button>
                    <a href="../07-favorites/favorite.html" class="top-action-btn favorites">⭐ المفضلة</a>
                </div>
                
                <!-- أيقونات اليسار (الموسيقى + تغيير الخلفية) -->
                <div style="display: flex; gap: 8px; align-items: center;">
                    <button type="button" class="top-action-btn music-btn" id="btnOpenMusicModal" title="مشغل الموسيقى">🎵</button>
                    <button type="button" class="top-action-btn" id="btnOpenBgModal" title="مشغل الخلفيات">🖼️</button>
                </div>
            </div>
        </header>

        <!-- صندوق الفلاتر والترتيب -->
        <div id="sortModal" class="inline-dropdown-box" style="display: none;">
            <div class="filter-section-modal">
                <div class="filter-group">
                    <label>الترتيب:</label>
                    <div id="sort-filters" class="chips-group">
                        <button class="chip active" data-sort="asc">من الأقدم</button>
                        <button class="chip" data-sort="desc">من الأحدث</button>
                    </div>
                </div>

                <div class="filter-group">
                    <label>النوع:</label>
                    <div id="type-filters" class="chips-group">
                        <button class="chip active" data-type="all">الكل</button>
                        <button class="chip" data-type="video">فيديو</button>
                        <button class="chip" data-type="short">شورت</button>
                        <button class="chip" data-type="lecture">محاضرة</button>
                    </div>
                </div>

                <div class="filter-group">
                    <label>الموضوع:</label>
                    <div id="topic-filters" class="chips-group">
                        <!-- تتولد ديناميكياً -->
                    </div>
                </div>
            </div>
        </div>

        <!-- نافذة مشغل الموسيقى -->
        <div id="musicModal" class="inline-dropdown-box" style="display: none; max-width: 280px; margin-right: auto; margin-left: 0;">
            <div class="filter-section-modal">
                <div style="font-weight: bold; font-size: 0.85rem; color: #f8fafc; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center;">
                    <span>مشغل الموسيقى</span>
                    <button type="button" id="closeMusicModal" style="background:none; border:none; color:#cbd5e1; cursor:pointer; font-size:1rem;">×</button>
                </div>
                <div style="display: flex; flex-direction: column; gap: 6px;">
                    <button type="button" class="top-action-btn" id="stopMusic" style="width: 100%; justify-content: center; background-color: rgba(220, 38, 38, 0.85); border-color: rgba(255,255,255,0.3); color: white;">⏹️ إيقاف الموسيقى</button>
                    <button type="button" class="top-action-btn" id="playMusic1" style="width: 100%; justify-content: center;">🎵 موسيقى 1</button>
                    <button type="button" class="top-action-btn" id="playMusic2" style="width: 100%; justify-content: center;">🧘 موسيقى 2</button>
                </div>
            </div>
        </div>

        <!-- نافذة اختيار وتغيير الخلفية الديناميكية -->
        <div id="bgModal" class="inline-dropdown-box" style="display: none; max-width: 280px; margin-right: auto; margin-left: 0;">
            <div class="filter-section-modal">
                <div style="font-weight: bold; font-size: 0.85rem; color: #f8fafc; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center;">
                    <span>مشغل الخلفيات</span>
                    <button type="button" id="closeBgModal" style="background:none; border:none; color:#cbd5e1; cursor:pointer; font-size:1rem;">×</button>
                </div>
                <!-- قائمة الأزرار ستتولد تلقائياً هنا عبر السكريبت -->
                <div id="bg-options-container" style="display: flex; flex-direction: column; gap: 6px;">
                    <!-- يتم توليد الخلفيات ديناميكياً -->
                </div>
            </div>
        </div>

        <!-- شبكة عرض البطاقات -->
        <section id="lessons-grid" class="lessons-grid">
            <!-- سيتم صب بطاقات الدروس هنا -->
        </section>
    </main>

    <!-- تضمين السكريبتات العامة -->
    <script src="../01-core/assets/global-audio.js"></script>
    <script src="../01-core/assets/global-background.js"></script>
    <script type="module" src="index-engine.js"></script>
</body>
                    </html>
