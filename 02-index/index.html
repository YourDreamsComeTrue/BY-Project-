<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فهرس الدروس</title>
    <link rel="stylesheet" href="index-style.css">
</head>
<body>

    <main class="index-container">
        <!-- هيدر نظيف ومدمج في الأعلى تماماً بدون عبارات إضافية -->
        <header class="index-header">
            <div class="header-top">
                <h1 class="main-title">فهرس الدروس</h1>
                <div class="top-actions-bar">
                    <a href="index.html" class="top-action-btn">📁 الفهرس</a>
                    <a href="../07-favorites/favorite.html" class="top-action-btn favorites">⭐ المفضلة</a>
                </div>
            </div>
        </header>

        <!-- صندوق الفلاتر المضغوط (الترتيب، النوع، الموضوع) -->
        <section class="filter-section">
            <!-- السطر الأول: الترتيب -->
            <div class="filter-group">
                <label>الترتيب:</label>
                <div id="sort-filters" class="chips-group">
                    <button class="chip active" data-sort="asc">من الأقدم</button>
                    <button class="chip" data-sort="desc">من الأحدث</button>
                </div>
            </div>

            <!-- السطر الثاني: النوع -->
            <div class="filter-group">
                <label>النوع:</label>
                <div id="type-filters" class="chips-group">
                    <button class="chip active" data-type="all">الكل</button>
                    <button class="chip" data-type="video">فيديو</button>
                    <button class="chip" data-type="short">شورت</button>
                    <button class="chip" data-type="lecture">محاضرة</button>
                </div>
            </div>

            <!-- السطر الثالث: الموضوع (يتعرف عليه السكريبت ديناميكياً) -->
            <div class="filter-group">
                <label>الموضوع:</label>
                <div id="topic-filters" class="chips-group">
                    <!-- تتولد الأزرار تلقائياً هنا عبر السكريبت دون الحاجة لكتابة إضافية -->
                </div>
            </div>
        </section>

        <!-- شبكة عرض البطاقات -->
        <section id="lessons-grid" class="lessons-grid">
            <!-- سيتم صب بطاقات الدروس هنا -->
        </section>
    </main>

    <script type="module" src="index-engine.js"></script>
</body>
    </html>
